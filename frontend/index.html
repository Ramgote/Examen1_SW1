<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UML Studio • Plataforma Colaborativa CASE</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS with Precision CASE & UML Studio Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary": "#0051d5",
              "primary-fixed": "#dae2fd",
              "on-primary-fixed-variant": "#3f465c",
              "on-error-container": "#93000a",
              "surface-container-high": "#dce9ff",
              "on-secondary-fixed-variant": "#003ea8",
              "tertiary-fixed-dim": "#93ccff",
              "on-tertiary-container": "#188ace",
              "on-primary-fixed": "#131b2e",
              "inverse-surface": "#213145",
              "error-container": "#ffdad6",
              "surface": "#f8f9ff",
              "on-primary-container": "#7c839b",
              "background": "#f8f9ff",
              "on-secondary-fixed": "#00174b",
              "secondary-fixed": "#dbe1ff",
              "surface-container-low": "#eff4ff",
              "on-secondary": "#ffffff",
              "outline": "#76777d",
              "on-tertiary": "#ffffff",
              "primary": "#000000",
              "surface-dim": "#cbdbf5",
              "secondary-container": "#316bf3",
              "tertiary": "#000000",
              "inverse-on-surface": "#eaf1ff",
              "on-surface-variant": "#45464d",
              "surface-container-highest": "#d3e4fe",
              "tertiary-fixed": "#cce5ff",
              "surface-tint": "#565e74",
              "surface-container-lowest": "#ffffff",
              "surface-bright": "#f8f9ff",
              "primary-container": "#131b2e",
              "on-primary": "#ffffff",
              "on-tertiary-fixed-variant": "#004b73",
              "on-tertiary-fixed": "#001d31",
              "secondary-fixed-dim": "#b4c5ff",
              "tertiary-container": "#001d31",
              "surface-container": "#e5eeff",
              "on-secondary-container": "#fefcff",
              "outline-variant": "#c6c6cd",
              "error": "#ba1a1a",
              "surface-variant": "#d3e4fe",
              "on-error": "#ffffff",
              "inverse-primary": "#bec6e0",
              "on-surface": "#0b1c30",
              "on-background": "#0b1c30",
              "primary-fixed-dim": "#bec6e0"
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            spacing: {
              "space-lg": "0.75rem",
              "space-xl": "1rem",
              "gutter": "0.5rem",
              "space-sm": "0.25rem",
              "margin": "0.75rem",
              "space-xs": "0.125rem",
              "space-md": "0.5rem"
            },
            fontFamily: {
              "label-caps": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "headline-md": ["Inter", "sans-serif"],
              "code-md": ["JetBrains Mono", "monospace"],
              "body-sm": ["Inter", "sans-serif"],
              "headline-sm": ["Inter", "sans-serif"],
              "headline-lg": ["Inter", "sans-serif"],
              "code-sm": ["JetBrains Mono", "monospace"]
            },
            fontSize: {
              "label-caps": ["0.6875rem", { "lineHeight": "1rem", "letterSpacing": "0.05em", "fontWeight": "600" }],
              "body-md": ["0.8125rem", { "lineHeight": "1.25rem", "fontWeight": "400" }],
              "headline-md": ["1rem", { "lineHeight": "1.5rem", "letterSpacing": "-0.01em", "fontWeight": "600" }],
              "code-md": ["0.75rem", { "lineHeight": "1.125rem", "fontWeight": "400" }],
              "body-sm": ["0.75rem", { "lineHeight": "1.125rem", "fontWeight": "400" }],
              "headline-sm": ["0.875rem", { "lineHeight": "1.25rem", "fontWeight": "600" }],
              "headline-lg": ["1.25rem", { "lineHeight": "1.75rem", "letterSpacing": "-0.015em", "fontWeight": "600" }],
              "code-sm": ["0.6875rem", { "lineHeight": "1rem", "fontWeight": "400" }]
            }
          }
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
