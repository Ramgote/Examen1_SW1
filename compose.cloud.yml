name: uml-cloud

x-api: &api
  image: uml-cloud-backend
  build: ./backend
  env_file: ./deploy/.env
  environment:
    POSTGRES_SERVER: db
    POSTGRES_PORT: 5432
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./deploy/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *api
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--ws-max-size", "4194304"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 7s
      retries: 10
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cloud
    restart: unless-stopped
    env_file: ./deploy/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
